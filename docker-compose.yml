services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports: ["5433:5432"]

    volumes:
      [
        "postgres_data:/var/lib/postgresql/data",
        "./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro",
      ]

volumes:
  postgres_data:
